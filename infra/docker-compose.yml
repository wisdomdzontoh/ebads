# Local deployment topology (docs/01-architecture.md §5, §10, docs/11-development-setup.md §3).
# Three services: the FastAPI engine, PostgreSQL 16 + PostGIS, and the expiry sweeper
# (docs/01 §10: "same image, different entrypoint" — FR10, S5). Both engine and sweeper wait
# for the DB healthcheck before starting, so `/readyz` is meaningful from the first request.

services:
  db:
    # PostGIS-enabled Postgres 16 (docs/01 §2, FR3) — a drop-in superset of postgres:16 built
    # on the same base image, so the existing pgdata volume and credentials are unaffected.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ebads
      POSTGRES_PASSWORD: ebads
      POSTGRES_DB: ebads
    ports:
      - "5432:5432"
    volumes:
      - ebads_pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` succeeding is the readiness signal the engine depends on.
      test: ["CMD-SHELL", "pg_isready -U ebads -d ebads"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  sweeper:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    # Overrides the image's default CMD (migrate + seed + serve) to just run the sweeper
    # loop — migrations are the engine service's job, not run twice. There is no
    # healthcheck-gated "wait for engine to finish migrating" here (engine has none either);
    # restart: on-failure covers the rare case the sweeper starts before the schema exists.
    command: ["python", "-m", "scripts.run_sweeper"]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

volumes:
  ebads_pgdata:
